name: iosApp
options:
  deploymentTarget:
    iOS: "18.5"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "20000"
packages:
  # Crashlytics alone: no Analytics, which could read the advertising identifier
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.2.0
targets:
  iosApp:
    type: application
    platform: iOS
    scheme:
      testTargets:
        # Spread over clones of the simulator, a test class each (see docs/Common/03_TESTS.md)
        - name: iosAppUITests
          parallelizable: true
    configFiles:
      Debug: Configuration/Scanny.xcconfig
      Release: Configuration/Scanny.xcconfig
    sources:
      - iosApp
    dependencies:
      - package: Firebase
        product: FirebaseCrashlytics
    settings:
      base:
        PRODUCT_NAME: Scanny
        PRODUCT_BUNDLE_IDENTIFIER: fr.skyle.scanny
        INFOPLIST_FILE: iosApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        # The Gradle build phase reads and writes outside of the Xcode project
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    postCompileScripts:
      # From the private submodule, when there: a build without it has no Firebase, so no Crashlytics
      - name: Copy the Firebase file
        basedOnDependencyAnalysis: false
        script: |
          source="$SRCROOT/../private/firebase/GoogleService-Info.plist"
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist"
          if [ -f "$source" ]; then
            cp "$source" "$destination"
          else
            rm -f "$destination"
          fi
    postBuildScripts:
      # The symbols of a release build, Kotlin included, for Crashlytics to read its crashes
      - name: Upload the symbols to Crashlytics
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          if [ "$CONFIGURATION" = "Release" ] && [ -f "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist" ]; then
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          fi
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.skyle.scanny.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # XCTest is not yet annotated for the strict concurrency of Swift 6
        SWIFT_VERSION: "5.0"