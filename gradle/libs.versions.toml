[versions]

# Android
compileSdk = "37"
targetSdk = "37"
minSdk = "26"

# Kotlin
kotlin = "2.4.21"
kotlinxSerialization = "1.13.0"

# Compose Multiplatform
composeMultiplatform = "1.12.2"

# Navigation 3
navigation3Multiplatform = "1.2.0"

# Lifecycle
lifecycleMultiplatform = "2.11.0" # androidx.lifecycle 2.11.0 on Android

# AndroidX
activityCompose = "1.13.0"

# Koin
koin = "4.2.2"

# Logs
kermit = "2.2.0"

# Firebase
firebaseBom = "34.14.1"

# Plugins
agp = "9.5.1"
googleServices = "4.4.4"
firebaseCrashlyticsPlugin = "3.0.7"
firebaseAppdistributionPlugin = "5.2.1"
easylauncherPlugin = "6.4.1"

[libraries]
# Compose Multiplatform
composeMultiplatform-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
composeMultiplatform-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
composeMultiplatform-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
composeMultiplatform-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
composeMultiplatform-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }

# Navigation 3
navigation3Multiplatform-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3Multiplatform" }

# Lifecycle
lifecycleMultiplatform-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleMultiplatform" }

# Kotlinx
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }

# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

# Logs
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }

# Gradle plugins, put on the build classpath by buildSrc
plugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
plugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-kotlinSerialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
plugin-composeCompiler = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
plugin-composeMultiplatform = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
plugin-googleServices = { module = "com.google.gms:google-services", version.ref = "googleServices" }
plugin-firebaseCrashlytics = { module = "com.google.firebase:firebase-crashlytics-gradle", version.ref = "firebaseCrashlyticsPlugin" }
plugin-firebaseAppdistribution = { module = "com.google.firebase:firebase-appdistribution-gradle", version.ref = "firebaseAppdistributionPlugin" }
plugin-easylauncher = { module = "com.project.starter:easylauncher", version.ref = "easylauncherPlugin" }