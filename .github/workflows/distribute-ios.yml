# Distribute iOS, in one click: Actions > Distribute iOS > Run workflow. fastlane builds the app signed
# for the App Store, with the distribution certificate of the team and the App Store profile of the
# app, and sends it to the testers of TestFlight (lane ios distribute).
name: Distribute iOS

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: What the testers should try (empty for fastlane/release_notes/X.Y-testers.txt)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  distribute:
    name: Build and distribute
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check the secrets of App Store Connect and of the signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID IOS_DISTRIBUTION_P12 IOS_DISTRIBUTION_P12_PASSWORD IOS_PROVISIONING_PROFILE; do
            if [ -z "${!name}" ]; then echo "::error::The secret $name is missing: see docs/Common/04_BUILD.md"; exit 1; fi
          done

      # The Firebase file of the private submodule, for Crashlytics, read with a read-only deploy key
      - name: Check out the code and the private submodule
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.PRIVATE_SUBMODULE_SSH_KEY }}
          submodules: true

      # The distribution certificate of the team and the App Store profile of the app, kept in base64
      - name: Write the certificate and the profile
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          printf '%s' "$IOS_DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/scanny.mobileprovision"

      # The build phase of the Xcode project builds the Shared framework with Gradle
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build and distribute
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_FILE: ${{ runner.temp }}/distribution.p12
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_FILE: ${{ runner.temp }}/scanny.mobileprovision
          CHANGELOG: ${{ inputs.changelog }}
        run: bundle exec fastlane ios distribute changelog:"$CHANGELOG"
