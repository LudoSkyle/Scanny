# Distribute Android, in one click: Actions > Distribute Android > Run workflow. fastlane builds the
# app signed with the keys of the private submodule, release or debug, and sends it to the testers of
# Firebase App Distribution (lane android distribute).
name: Distribute Android

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Variant of the app
        type: choice
        options:
          - release
          - debug
        default: release
      groups:
        description: Groups of testers, separated by commas
        type: string
        default: Internal
      releaseNotes:
        description: What the testers should try (empty for fastlane/release_notes/X.Y-testers.txt)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  distribute:
    name: Build and distribute
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the code and the private submodule
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.PRIVATE_SUBMODULE_SSH_KEY }}
          submodules: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build and distribute
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/firebase-service-account.json
          VARIANT: ${{ inputs.variant }}
          GROUPS: ${{ inputs.groups }}
          RELEASE_NOTES: ${{ inputs.releaseNotes }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$FIREBASE_SERVICE_ACCOUNT_FILE"
          bundle exec fastlane android distribute variant:"$VARIANT" groups:"$GROUPS" release_notes:"$RELEASE_NOTES"
