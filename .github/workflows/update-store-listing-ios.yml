# Update Store Listing iOS, in one click: Actions > Update Store Listing iOS > Run workflow, from main.
# fastlane sends the store listing written in fastlane/metadata/ios to App Store Connect, without any new
# build (lane ios store_listing). Each release sends it too.
name: Update Store Listing iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update the store listing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Update the store listing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          bundle exec fastlane ios store_listing
