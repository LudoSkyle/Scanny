# Release and Publish iOS, in one click: Actions > Release and Publish iOS > Run workflow, from main.
# fastlane builds the app signed for the App Store, with the distribution certificate of the team and
# the App Store profile of the app, publishes it with the store listing of fastlane/metadata/ios to App
# Store Connect, submitted for review or not, then releases it on GitHub under the tag of the version
# (lane ios release_and_publish).
name: Release and Publish iOS

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the version for review once uploaded
        type: boolean
        default: false

concurrency:
  group: release-ios

# To release the app on GitHub
permissions:
  contents: write

jobs:
  release:
    name: Release and publish
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check the secrets of App Store Connect and of the signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID IOS_DISTRIBUTION_P12 IOS_DISTRIBUTION_P12_PASSWORD IOS_PROVISIONING_PROFILE; do
            if [ -z "${!name}" ]; then echo "::error::The secret $name is missing: see docs/Common/04_BUILD.md"; exit 1; fi
          done

      # The Firebase file of the private submodule, for Crashlytics, read with a read-only deploy key
      - name: Check out the code and the private submodule
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.PRIVATE_SUBMODULE_SSH_KEY }}
          submodules: true

      # The distribution certificate of the team and the App Store profile of the app, kept in base64
      - name: Write the certificate and the profile
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          printf '%s' "$IOS_DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/scanny.mobileprovision"

      # The build phase of the Xcode project builds the Shared framework with Gradle
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Release and publish
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_FILE: ${{ runner.temp }}/distribution.p12
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_FILE: ${{ runner.temp }}/scanny.mobileprovision
          GH_TOKEN: ${{ github.token }}
        run: bundle exec fastlane ios release_and_publish submit:${{ inputs.submit }}
