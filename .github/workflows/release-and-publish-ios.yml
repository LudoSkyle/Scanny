# Release and Publish iOS, in one click: Actions > Release and Publish iOS > Run workflow, from main.
# fastlane builds the app signed for the App Store with the certificate and the profile of match,
# publishes it with the store listing of fastlane/metadata/ios to App Store Connect, submitted for
# review or not, then releases it on GitHub under the tag of the version (lane ios release_and_publish).
name: Release and Publish iOS

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the version for review once uploaded
        type: boolean
        default: false

concurrency:
  group: release-ios

# To release the app on GitHub
permissions:
  contents: write

jobs:
  release:
    name: Release and publish
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check the secrets of App Store Connect and match
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_SSH_KEY: ${{ secrets.MATCH_SSH_KEY }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID MATCH_PASSWORD MATCH_SSH_KEY; do
            if [ -z "${!name}" ]; then echo "::error::The secret $name is missing: see docs/Common/04_BUILD.md"; exit 1; fi
          done

      - name: Check out the code
        uses: actions/checkout@v7

      # The certificates of match, in their own private repository, read with a read-only deploy key
      - name: Reach the certificates of match
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_KEY }}

      # The build phase of the Xcode project builds the Shared framework with Gradle
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Release and publish
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: git@github.com:LudoSkyle/Scanny-Certificates.git
          GH_TOKEN: ${{ github.token }}
        run: bundle exec fastlane ios release_and_publish submit:${{ inputs.submit }}
